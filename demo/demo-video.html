<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReconGuard — Demo Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ─── DESIGN TOKENS ─────────────────────────────────────────────────────── */
:root {
  --canvas:       #0A0C0F;
  --panel:        #12151A;
  --raised:       #171B21;
  --hover:        #1C222A;
  --line:         #232830;
  --line-strong:  #2F3641;
  --ink:          #E8EBEF;
  --ink-2:        #99A2AD;
  --ink-3:        #69727E;
  --accent:       #F0B429;
  --matched:      #3FCF8E;
  --partial:      #56A8F5;
  --review:       #F0B429;
  --duplicate:    #B98AFF;
  --exception:    #FF6B6B;
  --unresolved:   #FF9A62;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: var(--canvas);
  font-family: 'Inter', sans-serif;
  color: var(--ink);
}

/* ─── HUD ─────────────────────────────────────────────────────────────────── */
#hud {
  position: fixed;
  top: 18px; right: 24px;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  pointer-events: none;
}
#hud-scene { color: var(--accent); font-weight: 600; }
#hud-timer { color: var(--ink-2); }
#hud-state {
  padding: 2px 8px;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
}

/* ─── SCENE CONTAINER ────────────────────────────────────────────────────── */
#scene-container {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 60px 80px;
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
}
.scene.active {
  opacity: 1;
  pointer-events: all;
}

/* ─── PROGRESS BAR ───────────────────────────────────────────────────────── */
#progress-container {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 900;
  height: 3px;
  background: var(--line);
}
#progress-bar {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.1s linear;
}

/* ─── VOICEOVER CAPTION ──────────────────────────────────────────────────── */
#caption {
  position: fixed;
  bottom: 14px; left: 50%;
  transform: translateX(-50%);
  z-index: 800;
  font-size: 14px;
  font-style: italic;
  color: var(--ink-3);
  text-align: center;
  max-width: 800px;
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
  letter-spacing: 0.01em;
  white-space: nowrap;
}
#caption.visible { opacity: 1; }

/* ─── KEYBOARD HINT ──────────────────────────────────────────────────────── */
#keyhint {
  position: fixed;
  bottom: 14px; right: 24px;
  z-index: 800;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  pointer-events: none;
}

/* ─── COMMON COMPONENTS ──────────────────────────────────────────────────── */
.scene-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--ink-3);
  text-transform: uppercase;
  margin-bottom: 28px;
  text-align: center;
}
.scene-title .accent { color: var(--accent); }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 24px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.chip-matched   { background: rgba(63,207,142,0.12);  color: var(--matched);   border: 1px solid rgba(63,207,142,0.25); }
.chip-partial   { background: rgba(86,168,245,0.12);  color: var(--partial);   border: 1px solid rgba(86,168,245,0.25); }
.chip-review    { background: rgba(240,180,41,0.12);  color: var(--review);    border: 1px solid rgba(240,180,41,0.25); }
.chip-duplicate { background: rgba(185,138,255,0.12); color: var(--duplicate); border: 1px solid rgba(185,138,255,0.25); }
.chip-exception { background: rgba(255,107,107,0.12); color: var(--exception); border: 1px solid rgba(255,107,107,0.25); }
.chip-accent    { background: rgba(240,180,41,0.12);  color: var(--accent);    border: 1px solid rgba(240,180,41,0.25); }
.chip-muted     { background: rgba(105,114,126,0.12); color: var(--ink-3);     border: 1px solid rgba(105,114,126,0.25); }
.chip-green     { background: rgba(63,207,142,0.12);  color: var(--matched);   border: 1px solid rgba(63,207,142,0.25); }

.mono { font-family: 'JetBrains Mono', monospace; }
.text-accent    { color: var(--accent); }
.text-matched   { color: var(--matched); }
.text-partial   { color: var(--partial); }
.text-exception { color: var(--exception); }
.text-ink2      { color: var(--ink-2); }
.text-ink3      { color: var(--ink-3); }

/* fade-in utility */
.fade-item {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.fade-item.show {
  opacity: 1;
  transform: translateY(0);
}

/* ─── SCENE 1 ─────────────────────────────────────────────────────────────── */
#s1-sources {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 28px;
}
.s1-source {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 0.7s ease;
}
.s1-source.visible { opacity: 1; }
.s1-dot { color: var(--line-strong); opacity: 0.5; font-size: 11px; }

#s1-chaos {
  position: relative;
  width: 700px;
  height: 180px;
  margin-bottom: 32px;
  flex-shrink: 0;
}
.chaos-line {
  position: absolute;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.chaos-line.visible { opacity: 1; }

#s1-pipeline {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transition: opacity 0.8s ease;
}
#s1-pipeline.visible { opacity: 1; }
.s1-arrow-label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--ink-2);
  text-transform: uppercase;
}
.s1-down-arrow {
  font-size: 28px;
  color: var(--accent);
  line-height: 1;
}

#s1-logo {
  margin-top: 18px;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: var(--ink);
  opacity: 0;
  transition: opacity 1s ease;
}
#s1-logo.visible { opacity: 1; }

/* ─── SCENE 2 ─────────────────────────────────────────────────────────────── */
#s2-shell {
  display: flex;
  width: 880px;
  height: 460px;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: var(--canvas);
}
#s2-sidebar {
  width: 140px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 20px 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex-shrink: 0;
}
.s2-nav {
  padding: 8px 16px;
  font-size: 13px;
  color: var(--ink-3);
  cursor: default;
  letter-spacing: 0.02em;
}
.s2-nav.active {
  color: var(--accent);
  background: rgba(240,180,41,0.07);
  border-right: 2px solid var(--accent);
}
#s2-main {
  flex: 1;
  background: var(--canvas);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow: hidden;
}
#s2-main-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.02em;
}
#s2-empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  border: 1px dashed var(--line-strong);
  border-radius: 6px;
  background: var(--panel);
}
.s2-empty-icon { font-size: 32px; opacity: 0.4; }
.s2-empty-text { font-size: 14px; color: var(--ink-3); }
#s2-run-btn {
  padding: 10px 24px;
  background: var(--accent);
  color: #0A0C0F;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.08em;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity 0.15s;
  text-transform: uppercase;
  font-family: 'Inter', sans-serif;
}
#s2-run-btn.clicked { opacity: 0.45; }
#s2-stats { display: none; flex-direction: column; gap: 10px; }
#s2-stats.visible { display: flex; }
.s2-stat-row { display: flex; gap: 10px; flex-wrap: wrap; }
.s2-stat-chip {
  padding: 8px 16px;
  background: var(--raised);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 0.06em;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.s2-stat-chip.show { opacity: 1; }
.s2-source-badge {
  padding: 5px 14px;
  background: rgba(86,168,245,0.08);
  border: 1px solid rgba(86,168,245,0.2);
  border-radius: 3px;
  font-size: 12px;
  font-weight: 600;
  color: var(--partial);
  letter-spacing: 0.08em;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.s2-source-badge.show { opacity: 1; }
#s2-counter {
  font-family: 'JetBrains Mono', monospace;
  font-size: 42px;
  font-weight: 700;
  color: var(--matched);
  display: none;
  margin-bottom: 2px;
}
#s2-counter-label {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  display: none;
}
#s2-counter.visible, #s2-counter-label.visible { display: block; }

/* ─── SCENE 3 ─────────────────────────────────────────────────────────────── */
#s3-cols {
  display: flex;
  gap: 0;
  width: 840px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.s3-col { flex: 1; padding: 22px; }
.s3-col-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.s3-arrow-col {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 14px;
  font-size: 22px;
  color: var(--ink-3);
  flex-shrink: 0;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}
.s3-raw-line {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-2);
  line-height: 2.4;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.s3-raw-line.show { opacity: 1; }
.s3-norm-card {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  margin-bottom: 10px;
  opacity: 0;
  transition: opacity 0.5s ease, transform 0.5s ease;
  transform: translateX(-8px);
}
.s3-norm-card.show { opacity: 1; transform: translateX(0); }
.s3-norm-field {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  line-height: 1.9;
  color: var(--ink);
}
.s3-norm-field .k { color: var(--ink-3); }
.s3-norm-field .v { color: var(--matched); }
.s3-original {
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 5px;
  font-style: italic;
  font-family: 'JetBrains Mono', monospace;
  border-top: 1px solid var(--line);
  padding-top: 5px;
}

/* ─── SCENE 4 ─────────────────────────────────────────────────────────────── */
#s4-drawer {
  width: 500px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 26px;
}
#s4-drawer-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.s4-calc-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  padding: 5px 0;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.s4-calc-row .label { color: var(--ink-3); }
.s4-calc-row .val { color: var(--ink); }
.s4-calc-row .neg { color: var(--exception); }
.s4-calc-row.show { opacity: 1; }
.s4-divider-row {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--line-strong);
  padding: 6px 0;
  opacity: 0;
  transition: opacity 0.4s ease;
  letter-spacing: 0.02em;
}
.s4-divider-row.show { opacity: 1; }
.s4-total-row {
  display: flex;
  justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 700;
  padding: 6px 0;
  color: var(--ink);
  border-top: 1px solid var(--line-strong);
  opacity: 0;
  transition: opacity 0.5s ease;
}
.s4-total-row.show { opacity: 1; }
.s4-balance {
  margin-top: 18px;
  padding: 13px;
  background: rgba(63,207,142,0.06);
  border: 1px solid rgba(63,207,142,0.2);
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.s4-balance.show { opacity: 1; }
.s4-balance-mark { font-size: 18px; color: var(--matched); }
.s4-balance-text { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: var(--matched); }
.s4-meta {
  margin-top: 14px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.s4-meta.show { opacity: 1; }
.s4-meta-item { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }
.s4-meta-item .val { color: var(--ink-2); }

/* ─── SCENE 5 ─────────────────────────────────────────────────────────────── */
#s5-content { width: 620px; }
#s5-progress-wrap { margin-bottom: 20px; opacity: 0; transition: opacity 0.5s ease; }
#s5-progress-wrap.show { opacity: 1; }
#s5-progress-track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
#s5-progress-fill { height: 100%; background: var(--matched); width: 0%; transition: width 2s ease-in-out; }
#s5-progress-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }
#s5-run-stats { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: var(--matched); margin-bottom: 24px; opacity: 0; transition: opacity 0.5s ease; }
#s5-run-stats.show { opacity: 1; }
.s5-layer {
  display: flex;
  align-items: center;
  padding: 11px 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  margin-bottom: 7px;
  opacity: 0;
  transition: opacity 0.5s ease, border-color 0.5s ease, background 0.5s ease;
  gap: 12px;
}
.s5-layer.show { opacity: 1; }
.s5-layer.lit { border-color: rgba(63,207,142,0.3); background: rgba(63,207,142,0.04); }
.s5-layer-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: var(--ink-3); width: 22px; text-align: center; }
.s5-layer-name { font-size: 13px; font-weight: 600; color: var(--ink); letter-spacing: 0.04em; flex: 1; }
.s5-layer-count { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: var(--matched); }
.s5-layer-check { font-size: 15px; color: var(--matched); opacity: 0; transition: opacity 0.3s ease; }
.s5-layer.lit .s5-layer-check { opacity: 1; }
#s5-exception-row {
  display: flex;
  align-items: center;
  padding: 9px 14px;
  background: rgba(255,107,107,0.06);
  border: 1px solid rgba(255,107,107,0.25);
  border-radius: 4px;
  margin-top: 7px;
  gap: 12px;
  opacity: 0;
  transition: opacity 0.5s ease;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}
#s5-exception-row.show { opacity: 1; }
.s5-exc-id { color: var(--exception); font-weight: 600; }
.s5-exc-reason { color: var(--ink-3); }
#s5-statement { margin-top: 18px; text-align: center; font-size: 22px; font-weight: 800; letter-spacing: 0.12em; color: var(--ink); opacity: 0; transition: opacity 0.6s ease; }
#s5-statement.show { opacity: 1; }

/* ─── SCENE 6 ─────────────────────────────────────────────────────────────── */
#s6-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 840px; margin-bottom: 20px; }
.s6-metric { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px 14px; opacity: 0; transition: opacity 0.5s ease; }
.s6-metric.show { opacity: 1; }
.s6-metric-label { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 8px; }
.s6-metric-value { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
.s6-metric-value.green { color: var(--matched); }
#s6-dist { width: 840px; }
.s6-dist-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; opacity: 0; transition: opacity 0.4s ease; }
.s6-dist-row.show { opacity: 1; }
.s6-dist-name { width: 90px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.s6-dist-count { width: 40px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink); text-align: right; }
.s6-dist-bar-wrap { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.s6-dist-bar { height: 100%; border-radius: 4px; width: 0%; transition: width 1s ease; }
.s6-dist-pct { width: 45px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-3); text-align: right; }
#s6-banner { margin-top: 16px; padding: 9px 20px; background: rgba(240,180,41,0.06); border: 1px solid rgba(240,180,41,0.2); border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); opacity: 0; transition: opacity 0.5s ease; text-align: center; }
#s6-banner.show { opacity: 1; }

/* ─── SCENE 7 ─────────────────────────────────────────────────────────────── */
#s7-layout { display: flex; gap: 0; width: 900px; }
#s7-table-wrap { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 6px 0 0 6px; overflow: hidden; }
.s7-col-heads { display: flex; padding: 8px 14px; background: var(--raised); border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: var(--ink-3); text-transform: uppercase; }
.s7-th { flex: 1; }
.s7-th-exp { width: 100px; text-align: right; }
.s7-row { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; opacity: 0; transition: opacity 0.4s ease, background 0.2s; }
.s7-row.show { opacity: 1; }
.s7-row.selected { background: var(--hover); }
.s7-cell { flex: 1; color: var(--ink-2); }
.s7-cell-exp { width: 100px; text-align: right; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
#s7-drawer { width: 280px; background: var(--panel); border: 1px solid var(--line); border-left: none; border-radius: 0 6px 6px 0; padding: 18px; opacity: 0; transition: opacity 0.5s ease; flex-shrink: 0; overflow-y: auto; }
#s7-drawer.show { opacity: 1; }
.s7-drawer-title { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 14px; }
.s7-drawer-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; gap: 8px; }
.s7-drawer-row:last-of-type { border-bottom: none; }
.s7-drawer-key { color: var(--ink-3); flex-shrink: 0; }
.s7-drawer-val { color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: right; }

<body>

<!-- HUD -->
<div id="hud">
  <span id="hud-scene">Scene 1 / 15</span>
  <span id="hud-timer">0:00</span>
  <span id="hud-state">PLAYING</span>
</div>

<!-- Keyboard hint -->
<div id="keyhint">SPACE pause &nbsp;·&nbsp; &#8592; prev &nbsp;·&nbsp; &#8594; next</div>

<!-- Scene container -->
<div id="scene-container"></div>

<!-- Progress bar -->
<div id="progress-container">
  <div id="progress-bar"></div>
</div>

<!-- Voiceover caption -->
<div id="caption"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   RECONGUARD DEMO PRESENTATION ENGINE
   Vanilla JS. No frameworks. Clean code for judge inspection.
═══════════════════════════════════════════════════════════════════════════ */

// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  currentScene: 0,
  paused: false,
  totalElapsed: 0,
  sceneElapsed: 0,
  animationTimers: [],
  sceneTimeout: null,
};

// ─── Scene durations (seconds) ────────────────────────────────────────────────
const SCENE_DURATIONS = [20, 15, 15, 20, 25, 15, 20, 25, 20, 20, 40, 30, 25, 15, 15];

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const container   = document.getElementById('scene-container');
const progressBar = document.getElementById('progress-bar');
const captionEl   = document.getElementById('caption');
const hudScene    = document.getElementById('hud-scene');
const hudTimer    = document.getElementById('hud-timer');
const hudState    = document.getElementById('hud-state');

// ─── Utilities ────────────────────────────────────────────────────────────────
function clearTimers() {
  state.animationTimers.forEach(t => clearTimeout(t));
  state.animationTimers = [];
}

function later(fn, ms) {
  const t = setTimeout(fn, Math.max(0, ms));
  state.animationTimers.push(t);
  return t;
}

function show(id, delay) {
  later(() => {
    const el = typeof id === 'string' ? document.getElementById(id) : id;
    if (el) el.classList.add('show');
  }, delay || 0);
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  return m + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

// ─── Progress & HUD update ────────────────────────────────────────────────────
setInterval(() => {
  if (state.paused) return;
  state.sceneElapsed += 0.1;
  state.totalElapsed += 0.1;
  const pct = Math.min((state.sceneElapsed / SCENE_DURATIONS[state.currentScene]) * 100, 100);
  progressBar.style.width = pct + '%';
  hudTimer.textContent = fmtTime(state.totalElapsed);
}, 100);

// ─── Scene mounting ───────────────────────────────────────────────────────────
function mountScene(index) {
  container.innerHTML = '';
  clearTimers();

  const cfg = SCENES[index];
  if (!cfg) return;

  const sceneEl = document.createElement('div');
  sceneEl.className = 'scene';
  container.appendChild(sceneEl);
  cfg.render(sceneEl);

  requestAnimationFrame(() => requestAnimationFrame(() => sceneEl.classList.add('active')));

  captionEl.textContent = cfg.voiceover || '';
  captionEl.classList.remove('visible');
  later(() => captionEl.classList.add('visible'), 800);
  hudScene.textContent = 'Scene ' + (index + 1) + ' / 15';
}

function goToScene(index) {
  if (index < 0 || index >= SCENES.length) return;
  const cur = container.querySelector('.scene.active');
  if (cur) cur.classList.remove('active');
  if (state.sceneTimeout) clearTimeout(state.sceneTimeout);

  state.currentScene = index;
  state.sceneElapsed = 0;

  later(() => {
    mountScene(index);
    scheduleNext();
  }, 600);
}

function scheduleNext() {
  if (state.sceneTimeout) clearTimeout(state.sceneTimeout);
  const dur = SCENE_DURATIONS[state.currentScene] * 1000;
  state.sceneTimeout = setTimeout(() => {
    if (!state.paused && state.currentScene < SCENES.length - 1) goToScene(state.currentScene + 1);
  }, dur);
}

// ─── Keyboard ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    state.paused = !state.paused;
    hudState.textContent = state.paused ? 'PAUSED' : 'PLAYING';
    if (!state.paused) scheduleNext();
    else clearTimeout(state.sceneTimeout);
  }
  if (e.code === 'ArrowRight') goToScene(state.currentScene + 1);
  if (e.code === 'ArrowLeft')  goToScene(state.currentScene - 1);
});

/* ═══════════════════════════════════════════════════════════════════════════
   SCENE DEFINITIONS
═══════════════════════════════════════════════════════════════════════════ */
const SCENES = [];

// ─── S1: THE FINANCE PROBLEM ──────────────────────────────────────────────────
SCENES.push({
  voiceover: "Finance teams don't reconcile one clean ledger.",
  render(el) {
    el.innerHTML = `
      <div style="text-align:center;width:100%;max-width:780px;">
        <div class="scene-title">The Reality of Finance Operations</div>
        <div id="s1-sources">
          <span class="s1-source" id="ss0">ORDERS</span><span class="s1-dot">&nbsp;·&nbsp;</span>
          <span class="s1-source" id="ss1">PAYMENTS</span><span class="s1-dot">&nbsp;·&nbsp;</span>
          <span class="s1-source" id="ss2">GATEWAY SETTLEMENTS</span><span class="s1-dot">&nbsp;·&nbsp;</span>
          <span class="s1-source" id="ss3">BANK STATEMENTS</span><span class="s1-dot">&nbsp;·&nbsp;</span>
          <span class="s1-source" id="ss4">INVOICES</span><span class="s1-dot">&nbsp;·&nbsp;</span>
          <span class="s1-source" id="ss5">REFUNDS</span><span class="s1-dot">&nbsp;·&nbsp;</span>
          <span class="s1-source" id="ss6">TAX RECORDS</span>
