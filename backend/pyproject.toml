[project]
name = "reconguard-backend"
version = "0.1.0"
description = "ReconGuard - deterministic reconciliation engine and finance control API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "python-dateutil==2.9.0.post0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "psycopg[binary]==3.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app/services/accounting", "app/services/reconciliation", "app/services/normalization", "app/core"]
